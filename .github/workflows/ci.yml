name: CI

on:
  push:
    branches: [master]
    # See https://docs.github.com/en/actions/using-workflows/workflow-syntax-for-github-actions#filter-pattern-cheat-sheet
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}-1
  # Cancel previous builds for pull requests only.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: NPM install
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Publish preview package
        if: github.event_name == 'pull_request'
        run: npx pkg-pr-new publish --bin

      - name: Pack (includes rescript build)
        run: npm pack

      - name: Prepare package upload
        # For pull requests, pass the correct commit SHA explicitly as GITHUB_SHA points to the wrong commit.
        run: node .github/workflows/prepare_package_upload.js ${{ github.event.pull_request.head.sha }}

      - name: "Upload artifact: npm package"
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.artifact_filename }}
          path: ${{ env.artifact_filename }}

    outputs:
      artifact_filename: ${{ env.artifact_filename }}

  test:
    needs: build

    strategy:
      fail-fast: false
      matrix:
        os: [
            macos-15, # x64
            macos-15-intel, # ARM
            ubuntu-24.04, # x64
            ubuntu-24.04-arm, # ARM
            windows-2025,
          ]

    runs-on: ${{matrix.os}}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0 # minimum supported version

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_filename }}

      - name: Test
        env:
          CI: 1
        shell: bash
        run: |
          npm i -g ${{ needs.build.outputs.artifact_filename }}
          npx create-rescript-app

  e2e:
    name: E2E (${{ matrix.manager }})
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        include:
          - manager: npm
            package: ""
          - manager: pnpm
            package: pnpm@10.11.0
          - manager: yarn-classic
            package: yarn@1.22.22
          - manager: yarn-berry
            package: "@yarnpkg/cli-dist@4.9.2"
          - manager: bun
            package: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.0 # minimum supported version

      - name: Install package manager
        if: matrix.package != ''
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          npm install --prefix "$RUNNER_TEMP/e2e-tools" "$PACKAGE"
          echo "$RUNNER_TEMP/e2e-tools/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Install Bun
        if: matrix.manager == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Download packed CLI
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_filename }}

      - name: Install, compile and run real projects
        env:
          PACKAGE: ${{ needs.build.outputs.artifact_filename }}
          MANAGER: ${{ matrix.manager }}
        run: >-
          python3 test/e2e/run.py
          --package "$PACKAGE"
          --manager "$MANAGER"
          --logs "$RUNNER_TEMP/cra-e2e-logs"

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-${{ matrix.manager }}-logs
          path: ${{ runner.temp }}/cra-e2e-logs
          if-no-files-found: ignore

  publish:
    needs: [build, test, e2e]

    if: startsWith(github.ref, 'refs/tags/v')

    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org # Needed to make auth work for publishing

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_filename }}

      - name: Publish packages on npm with tag "next"
        run: |
          npm publish ${{ needs.build.outputs.artifact_filename }} --tag next
